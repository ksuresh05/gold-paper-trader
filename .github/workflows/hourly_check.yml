name: Gold Paper Trader Hourly Check

# Runs every hour, 24/7 -- matches the underlying 1h candle data (checking
# more often wouldn't surface new information anyway). Entry-session
# filtering (previously 8am-9pm GMT) has been removed from the script
# itself (SESSION_FILTER_ENABLED=False) -- entries can now happen at any
# hour, not just during that window. An open position is still monitored
# every run regardless.
# NOTE: GitHub Actions scheduling is BEST-EFFORT, not guaranteed. Real-world
# testing showed gaps of 2-3+ hours between runs even on an hourly cron,
# especially at the top of the hour (":00") when many workflows across all
# of GitHub compete for the same runner capacity -- this is a documented,
# widespread platform limitation, not specific to this workflow. Moving to
# :17 past the hour reduces contention per GitHub's own guidance, but does
# NOT guarantee exact hourly timing -- delays can still happen.
#
# This delay does NOT cause incorrect results: process_new_bars() walks
# forward through EVERY closed 1h bar since the last check, applying the
# exact entry/exit logic to each one in the correct order -- so a stop hit
# 2 hours ago is still detected and priced correctly once the script does
# run, it's just detected later. The cost of a delay is TIME-TO-AWARENESS,
# not correctness of the recorded trade history.
#
# If sub-hour, guaranteed-timely monitoring becomes necessary (e.g. for
# real capital, not paper tracking), a genuine always-on process (e.g. a
# paid PythonAnywhere always-on task) is the correct fix -- GitHub Actions'
# free scheduler is not built for that reliability level.
on:
  schedule:
    - cron: '17 * * * *'   # 17 minutes past every hour, every day -- avoids top-of-hour
                             # contention, per GitHub's own guidance: "To decrease the
                             # chance of delay, schedule your workflow to run at a
                             # different time of the hour." Still best-effort, not
                             # guaranteed exact -- see note above.
  workflow_dispatch: {}     # also allows manual triggering from the Actions tab, for testing

permissions:
  contents: write   # required so the workflow can commit updated state/report files back to the repo

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history not needed, but ensure we get the LATEST committed
          # state/ and html/ files from the previous run, not a stale cache.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance

      - name: Ensure state/html folders exist
        run: mkdir -p state html

      - name: Run single check
        run: python3 gold_paper_trader.py --once

      - name: Commit updated state and report back to the repo
        # This is the critical step that makes continuity work across runs:
        # GitHub Actions runners are ephemeral (fresh checkout every time),
        # so without committing state/paper_state.json and state/trade_log.csv
        # back to the repo, the script would "fresh start" on every single
        # run and never actually track anything across days.
        run: |
          git config user.name "gold-paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ html/
          # Only commit if something actually changed -- avoids empty commits
          # on days where "No new completed bars" means nothing was written.
          git diff --staged --quiet || git commit -m "Automated paper trader check: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
