name: Gold Paper Trader Continuous Check

# DESIGN: single long-running job per trigger, with an internal loop
# (not a single --once call). Combined with `concurrency` below, this
# solves the gap problem seen with pure hourly --once triggers:
#   - Each job runs for ~70 minutes, checking every 15 minutes internally
#     (~4-5 checks per job) via the script's own main_loop_for_duration().
#   - The trigger fires every hour, but the loop runs slightly LONGER
#     (70 min) than the trigger interval (60 min) -- so if the next
#     hourly trigger is delayed (GitHub's scheduling is best-effort, not
#     guaranteed -- see prior testing showing 2-7+ hour gaps on a bare
#     --once/hourly-trigger design), the CURRENT job is still running and
#     covering the gap. There should be no dead time where nothing is
#     checking, as long as SOME trigger successfully starts within any
#     70-minute window.
#   - `concurrency` with cancel-in-progress: false means if a new hourly
#     trigger fires while a previous job is still in its 70-minute loop,
#     the NEW run is queued (not started, not cancelling the old one) --
#     avoiding the two failure modes considered and rejected: (a) two
#     runners racing to git push at once (git conflict / duplicate risk),
#     and (b) killing an in-progress job's remaining coverage window.
#
# This does NOT guarantee zero gaps -- if GitHub fails to start ANY
# trigger for over 70 minutes (rare but possible during platform
# incidents), there would still be a gap. But this is a large
# improvement over the plain hourly --once design, which showed gaps of
# 2-7+ hours in real testing even after moving off the top-of-hour minute.
on:
  schedule:
    - cron: '0 * * * *'   # every hour -- contention at :00 matters less now
                            # since the job itself runs long and covers gaps
  workflow_dispatch: {}     # also allows manual triggering from the Actions tab, for testing

concurrency:
  group: gold-paper-trader-continuous
  cancel-in-progress: false   # queue, don't cancel -- let an in-progress 70-min loop finish

permissions:
  contents: write   # required so the workflow can commit updated state/report files back to the repo

jobs:
  run-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # safety ceiling above the ~70min intended loop duration,
                            # in case something hangs -- GitHub kills the job at this point
                            # regardless (well under the platform's own 360min hard limit)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance

      - name: Configure git identity for commits
        run: |
          git config user.name "gold-paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run continuous loop for ~70 minutes, committing after each check
        # This runs main_loop_for_duration(), which checks every 15 minutes
        # (via run_once()) and commits+pushes after EACH check individually
        # -- not just once at the end -- so if the job is killed early
        # (crash, timeout) no completed checks are lost, only whatever
        # check was in progress at that moment.
        run: python3 gold_paper_trader.py --loop-minutes 70 --check-interval-minutes 15 --git-commit-each-check
